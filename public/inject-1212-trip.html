<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12/12 行程問卷一鍵注入</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#fff7ed;color:#334155;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,520px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 15px 40px #9a34121c}.btn{width:100%;border:0;border-radius:14px;padding:16px;background:#f97316;color:white;font-size:18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.ok{color:#15803d}.err{color:#b91c1c}pre{white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:12px;font-size:13px}.link{display:none;margin-top:14px;text-align:center}</style></head><body><div class="card"><h1>🏕️ 12/12 行程問卷</h1><p>按一次即可建立／更新固定問卷，不會重複產生多份。</p><pre>12/12 D1：鐵道驛站 → 舊山線鐵道自行車 → 蔓森活民宿 → 星空晚會／晚餐

After:false},{id:"attendees",type:"counter_group",label:"參加人數",description:"請填本次實際參加的大人與小孩人數；小孩請逐一選擇年齡，以計算鐵道自行車票價。",required:true,items:[{id:"adult",label:"大人",sublabel:"7歲以上票價以成人價 $285 計",min:0,pricing:{actualUnitPrice:285,prepayUnitPrice:0}},{id:"child",label:"小孩",sublabel:"請選擇每位小孩年齡",min:0,ageOptions:ages,pricing:{actualUnitPrice:230,prepayUnitPrice:0,agePriceRules:"0-6:230,7+:285"}}],pageBreakAfter:true},{id:"rooms",type:"counter_group",label:"住宿房型確認",description:"房型已依先前調查預抓，請依目前需求填寫需要的房間／加床數。住宿預收已併入每人預收。",required:false,items:[{id:"twin",label:"雙人房",sublabel:"$3,500／間",min:0,pricing:{actualUnitPrice:3500,prepayUnitPrice:0}},{id:"quad",label:"四人房",sublabel:"$5,200／間",min:0,pricing:{actualUnitPrice:5200,prepayUnitPrice:0}},{id:"extra",label:"加床",sublabel:"$800／人",min:0,pricing:{actualUnitPrice:800,prepayUnitPrice:0}}],pageBreakAfter:true},{id:"shirts",type:"counter_group",label:"隊服尺寸與件數",description:"暫收 $700／件。最終單價依各填答家庭件數暫估；後台可調整級距。",required:false,items:[{id:"s",label:"S",sublabel:"件數",min:0,pricing:{actualUnitPrice:700,prepayUnitPrice:700,tierRules:"15:750,20:700,50:650"}},{id:"m",label:"M",sublabel:"件數",min:0,pricing:{actualUnitPrice:700,prepayUnitPrice:700,tierRules:"15:750,20:700,50:650"}},{id:"l",label:"L",sublabel:"件數",min:0,pricing:{actualUnitPrice:700,prepayUnitPrice:700,tierRules:"15:750,20:700,50:650"}},{id:"xl",label:"XL",sublabel:"件數",min:0,pricing:{actualUnitPrice:700,prepayUnitPrice:700,tierRules:"15:750,20:700,50:650"}},{id:"2xl",label:"2XL",sublabel:"件數",min:0,pricing:{actualUnitPrice:700,prepayUnitPrice:700,tierRules:"15:750,20:700,50:650"}},{id:"3xl",label:"3XL",sublabel:"件數",min:0,pricing:{actualUnitPrice:700,prepayUnitPrice:700,tierRules:"15:750,20:700,50:650"}}],pageBreakAfter:true},{id:"note",type:"textarea",label:"其他需求／備註",description:"例如飲食禁忌、住宿特殊需求、隊服特殊尺寸等；沒有可留空。",placeholder:"請輸入備註…",required:false,pageBreakAfter:false}]};const btn=document.getElementById("inject"),status=document.getElementById("status"),link=document.getElementById("surveyLink");btn.onclick=async()=>{btn.disabled=true;status.className="";status.textContent="正在注入…";try{await signInAnonymously(auth);const ref=doc(db,"artifacts","survey-builder-app","public","data","surveys",surveyId);await setDoc(ref,survey,{merge:false});const url=`${location.origin}/?s=${surveyId}`;status.className="ok";status.textContent="✅ 注入完成！費用已改為後台可維護設定。";link.href=url;link.style.display="block";link.textContent="開啟問卷 →"}catch(e){console.error(e);status.className="err";status.textContent="❌ 注入失敗："+(e?.message||e);btn.disabled=false}};</script></body></html>
