        function toLocalInputValue(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function renderQuestionEditorList() {
            const s = state.editingSurvey;
            const container = document.getElementById('question-editor-list');
            if (!container) return;
            if (s.questions.length === 0) {
                container.innerHTML = `<div class="text-center text-sm text-gray-400 py-6 border-2 border-dashed border-gray-200 rounded-xl">尚未有任何題目，點下方按鈕新增第一題吧！</div>`;
            } else {
                container.innerHTML = s.questions.map((q, idx) => renderQuestionEditorCard(q, idx, s.questions.length)).join('');
            }
            attachQuestionEditorHandlers();
            document.querySelectorAll('.q-just-added').forEach(el => {
                setTimeout(() => el.classList.remove('q-just-added'), 1400);
            });
        }

        function renderQuestionEditorCard(q, idx, total) {
            const typeMeta = QUESTION_TYPE_LABELS[q.type] || { icon: 'fa-question', label: q.type };
            let typeSpecificHtml = '';
            if (q.type === 'short_text' || q.type === 'textarea') {
                typeSpecificHtml = `
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">提示文字 (placeholder)</label>
                        <input type="text" class="q-field w-full border-2 border-gray-200 rounded-lg py-2 px-3 text-sm" data-idx="${idx}" data-field="placeholder" value="${escapeHtml(q.placeholder || '')}">
                    </div>`;
            } else if (q.type.startsWith('choice')) {
                typeSpecificHtml = `
                    <div class="flex flex-wrap gap-4 text-sm">
                        <label class="flex items-center gap-1.5"><input type="checkbox" class="q-field" data-idx="${idx}" data-field="allowCustom" data-bool="1" ${q.allowCustom ? 'checked' : ''}> 允許其他自填</label>
                    </div>
                    ${q.allowCustom ? `<div><label class="block text-xs font-semibold text-gray-500 mb-1">自填欄位標籤</label><input type="text" class="q-field w-full border-2 border-gray-200 rounded-lg py-2 px-3 text-sm" data-idx="${idx}" data-field="customLabel" value="${escapeHtml(q.customLabel || '')}"></div>` : ''}
                    <div class="space-y-2">
                        <div class="text-xs font-semibold text-gray-500">選項：</div>
                        ${q.options.map((opt, oi) => `
                            <div class="border border-gray-200 rounded-lg p-2 space-y-1.5">
                                <div class="flex items-center gap-2">
                                    <input type="text" class="opt-field flex-grow border border-gray-200 rounded-lg py-1.5 px-2 text-sm" data-idx="${idx}" data-oi="${oi}" data-field="label" value="${escapeHtml(opt.label)}" placeholder="選項文字">
                                    <button class="del-opt-btn text-red-400 hover:text-red-600 text-sm px-2" data-idx="${idx}" data-oi="${oi}"><i class="fas fa-times"></i></button>
                                </div>
                                ${q.type === 'choice_cards' ? `
                                    <input type="text" class="opt-field w-full border border-gray-200 rounded-lg py-1.5 px-2 text-xs" data-idx="${idx}" data-oi="${oi}" data-field="img" value="${escapeHtml(opt.img || '')}" placeholder="圖片網址">
                                    <textarea class="opt-field w-full border border-gray-200 rounded-lg py-1.5 px-2 text-xs resize-none h-14" data-idx="${idx}" data-oi="${oi}" data-field="desc" placeholder="說明文字">${escapeHtml(opt.desc || '')}</textarea>
                                    <input type="text" class="opt-field w-full border border-gray-200 rounded-lg py-1.5 px-2 text-xs" data-idx="${idx}" data-oi="${oi}" data-field="url" value="${escapeHtml(opt.url || '')}" placeholder="官方網站連結 (選填)">
                                ` : ''}
                            </div>
                        `).join('')}
                        <button class="add-opt-btn text-xs px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 font-medium" data-idx="${idx}"><i class="fas fa-plus mr-1"></i>新增選項</button>
                    </div>`;
            } else if (q.type === 'counter_group') {
                typeSpecificHtml = `
                    <div class="space-y-2">
                        <div class="text-xs font-semibold text-gray-500">計數項目：</div>
                        ${q.items.map((item, ii) => `
                            <div class="border border-gray-200 rounded-lg p-2 space-y-1.5">
                                <div class="flex items-center gap-2">
                                    <input type="text" class="item-field flex-grow border border-gray-200 rounded-lg py-1.5 px-2 text-sm" data-idx="${idx}" data-ii="${ii}" data-field="label" value="${escapeHtml(item.label)}" placeholder="項目名稱，如：大人">
                                    <button class="del-item-btn text-red-400 hover:text-red-600 text-sm px-2" data-idx="${idx}" data-ii="${ii}"><i class="fas fa-times"></i></button>
                                </div>
                                <input type="text" class="item-field w-full border border-gray-200 rounded-lg py-1.5 px-2 text-xs" data-idx="${idx}" data-ii="${ii}" data-field="sublabel" value="${escapeHtml(item.sublabel || '')}" placeholder="附註，如：12歲以上">
                                <div class="flex items-center gap-3 text-xs">
                                    <label class="flex items-center gap-1">最小值 <input type="number" min="0" class="item-field w-16 border border-gray-200 rounded-lg py-1 px-1.5" data-idx="${idx}" data-ii="${ii}" data-field="min" value="${item.min || 0}"></label>
                                    <label class="flex items-center gap-1.5"><input type="checkbox" class="item-field" data-idx="${idx}" data-ii="${ii}" data-field="hasAge" data-bool="1" ${item.ageOptions ? 'checked' : ''}> 啟用年齡選單</label>
                                </div>
                                ${item.ageOptions ? `<div><label class="block text-xs font-semibold text-gray-500 mb-1">年齡選項（用頓號、分隔）</label><input type="text" class="item-field w-full border border-gray-200 rounded-lg py-1.5 px-2 text-xs" data-idx="${idx}" data-ii="${ii}" data-field="ageOptionsStr" value="${escapeHtml(item.ageOptions.join('、'))}"></div>` : ''}
                            </div>
                        `).join('')}
                        <button class="add-item-btn text-xs px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 font-medium" data-idx="${idx}"><i class="fas fa-plus mr-1"></i>新增項目</button>
                    </div>`;
            }
            return `
                <div class="border-2 border-gray-100 rounded-xl overflow-hidden ${q._justAdded ? 'q-just-added' : ''}" data-qid="${q.id}">
                    <div class="flex items-center gap-2 p-3 bg-gray-50">
                        <i class="fas fa-grip-vertical drag-handle text-gray-300 hover:text-gray-500 px-1 flex-shrink-0" title="拖曳排序"></i>
                        <i class="fas ${typeMeta.icon} text-gray-400"></i>
                        <span class="text-xs font-medium text-gray-500 flex-shrink-0">${typeMeta.label}</span>
                        <span class="font-bold text-gray-800 truncate flex-grow">${escapeHtml(q.label) || '(未命名題目)'}</span>
                        <button class="q-toggle-open text-gray-400 hover:text-gray-700 px-1" data-idx="${idx}"><i class="fas fa-chevron-down admin-card-chevron ${q._open ? 'open' : ''}"></i></button>
                        <button class="q-delete text-red-400 hover:text-red-600 px-1" data-idx="${idx}"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="admin-card-detail ${q._open ? 'open' : ''}" id="q-detail-${idx}">
                        <div class="p-3 space-y-3 border-t border-gray-100">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">題目標題</label>
                                <input type="text" class="q-field w-full border-2 border-gray-200 rounded-lg py-2 px-3 text-sm" data-idx="${idx}" data-field="label" value="${escapeHtml(q.label)}">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1">說明文字（選填）</label>
                                <input type="text" class="q-field w-full border-2 border-gray-200 rounded-lg py-2 px-3 text-sm" data-idx="${idx}" data-field="description" value="${escapeHtml(q.description || '')}">
                            </div>
                            <div class="flex flex-wrap gap-4 text-sm">
                                <label class="flex items-center gap-1.5"><input type="checkbox" class="q-field" data-idx="${idx}" data-field="required" data-bool="1" ${q.required ? 'checked' : ''}> 必填</label>
                                <label class="flex items-center gap-1.5"><input type="checkbox" class="q-field" data-idx="${idx}" data-field="pageBreakBefore" data-bool="1" ${q.pageBreakBefore ? 'checked' : ''}> 從此題另起一頁</label>
                            </div>
                            ${typeSpecificHtml}
                        </div>
                    </div>
                </div>`;
        }

        function attachQuestionEditorHandlers() {
            const s = state.editingSurvey;
            document.querySelectorAll('.q-toggle-open').forEach(b => b.addEventListener('click', () => {
                const idx = Number(b.dataset.idx);
                s.questions[idx]._open = !s.questions[idx]._open;
                renderQuestionEditorList();
            }));
            document.querySelectorAll('.q-delete').forEach(b => b.addEventListener('click', async () => {
                const idx = Number(b.dataset.idx);
                const confirmed = await showConfirm('刪除題目', '確定要刪除這個題目嗎？');
                if (confirmed) { s.questions.splice(idx, 1); renderQuestionEditorList(); }
            }));
            document.querySelectorAll('.q-field').forEach(el => {
                const evt = el.type === 'checkbox' ? 'change' : 'input';
                el.addEventListener(evt, () => {
                    const idx = Number(el.dataset.idx), field = el.dataset.field;
                    const q = s.questions[idx];
                    if (field === 'allowCustom') { q.allowCustom = el.checked; renderQuestionEditorList(); return; }
                    if (el.dataset.bool) q[field] = el.checked; else q[field] = el.value;
                    if (field === 'label' || field === 'required') {
                        const header = document.querySelectorAll('#question-editor-list > div')[idx];
                        if (header && field === 'label') {
                            const headerLabel = header.querySelector('.flex.items-center.gap-2.p-3 > span.font-bold');
                            if (headerLabel) headerLabel.textContent = el.value || '(未命名題目)';
                        }
                    }
                });
            });
            document.querySelectorAll('.opt-field').forEach(el => {
                el.addEventListener('input', () => {
                    const idx = Number(el.dataset.idx), oi = Number(el.dataset.oi), field = el.dataset.field;
                    s.questions[idx].options[oi][field] = el.value;
                });
            });
            document.querySelectorAll('.del-opt-btn').forEach(b => b.addEventListener('click', () => {
                const idx = Number(b.dataset.idx), oi = Number(b.dataset.oi);
                s.questions[idx].options.splice(oi, 1);
                renderQuestionEditorList();
            }));
            document.querySelectorAll('.add-opt-btn').forEach(b => b.addEventListener('click', () => {
                const idx = Number(b.dataset.idx);
                const q = s.questions[idx];
                const newOpt = { id: genId(), label: '新選項' };
                if (q.type === 'choice_cards') { newOpt.img = ''; newOpt.desc = ''; newOpt.url = ''; }
                q.options.push(newOpt);
                q._open = true;
                renderQuestionEditorList();
            }));
            document.querySelectorAll('.item-field').forEach(el => {
                const evt = el.type === 'checkbox' ? 'change' : 'input';
                el.addEventListener(evt, () => {
                    const idx = Number(el.dataset.idx), ii = Number(el.dataset.ii), field = el.dataset.field;
                    const item = s.questions[idx].items[ii];
                    if (field === 'hasAge') { item.ageOptions = el.checked ? [...DEFAULT_AGE_OPTIONS] : undefined; renderQuestionEditorList(); return; }
                    if (field === 'ageOptionsStr') { item.ageOptions = el.value.split(/[、,]/).map(x => x.trim()).filter(Boolean); return; }
                    if (field === 'min') { item.min = Number(el.value) || 0; return; }
                    item[field] = el.value;
                });
            });
            document.querySelectorAll('.del-item-btn').forEach(b => b.addEventListener('click', () => {
                const idx = Number(b.dataset.idx), ii = Number(b.dataset.ii);
                s.questions[idx].items.splice(ii, 1);
                renderQuestionEditorList();
            }));
            document.querySelectorAll('.add-item-btn').forEach(b => b.addEventListener('click', () => {
                const idx = Number(b.dataset.idx);
                s.questions[idx].items.push({ id: genId(), label: '新項目', sublabel: '', min: 0 });
                s.questions[idx]._open = true;
                renderQuestionEditorList();
            }));

            const listEl = document.getElementById('question-editor-list');
            if (questionSortable) { questionSortable.destroy(); questionSortable = null; }
            if (listEl && s.questions.length > 1 && typeof Sortable !== 'undefined') {
                questionSortable = new Sortable(listEl, {
                    handle: '.drag-handle',
                    animation: 180,
                    ghostClass: 'q-card-ghost',
                    chosenClass: 'q-card-chosen',
                    onEnd: (evt) => {
                        if (evt.oldIndex === evt.newIndex) return;
                        const arr = state.editingSurvey.questions;
                        const [moved] = arr.splice(evt.oldIndex, 1);
                        arr.splice(evt.newIndex, 0, moved);
                        renderQuestionEditorList();
                    }
                });
            }
        }

        async function saveSurvey() {
            const s = state.editingSurvey;
            if (!s.title.trim()) { showMessage('尚未填寫', '請輸入問卷標題'); return; }
            const cleanQuestions = JSON.parse(JSON.stringify(s.questions)).map(q => { delete q._open; delete q._justAdded; return q; });
            const payload = { ...s, questions: cleanQuestions };
            delete payload.id;
            try {
                if (state.editingSurveyId) {
                    await setDoc(surveyDocRef(state.editingSurveyId), payload);
                } else {
                    await addDoc(surveysCol(), payload);
                }
                await showMessage('已儲存', '問卷已成功儲存！', 'success');
                state.mode = 'admin-dashboard';
                applyAdminChrome();
                render();
            } catch (e) {
                console.error(e);
                showMessage('錯誤', '儲存失敗，請檢查網路連線。', 'error');
            }
        }

        function openResponsesView(surveyId) {
            const s = state.adminSurveys.find(x => x.id === surveyId);
            if (!s) return;
            state.viewingSurveyId = surveyId;
            state.viewingSurveyMeta = s;
            state.mode = 'admin-responses';
            state.responsesData = [];
            state.expandedCards = new Set();
            applyAdminChrome();
            render();
        }

        function renderAdminResponses() {
            const s = state.viewingSurveyMeta;
            DOM.root.innerHTML = `
                <div class="w-full animate-fade-in space-y-4">
                    <div class="flex items-center justify-between">
                        <button id="btn-resp-back" class="text-sm text-gray-500 hover:text-gray-700"><i class="fas fa-chevron-left mr-1"></i>返回列表</button>
                        <h1 class="text-lg font-bold text-gray-800 truncate max-w-[50%]">${escapeHtml(s.title)}</h1>
                        ${adminThemeToggleHtml()}
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="font-bold text-gray-800 flex items-center gap-2">
                                <i class="fas fa-poll" style="color:var(--brand-500)"></i> 回覆資料
                                <span class="flex items-center gap-1.5 text-xs text-green-600 font-normal ml-1"><span class="live-dot"></span> 即時更新中</span>
                            </h2>
                            <span id="resp-total-badge" class="text-xs font-bold px-2 py-1 rounded-full" style="background-color:var(--brand-100);color:var(--brand-700)">0 筆</span>
                        </div>
                        <div id="question-stats"></div>
                        <div class="flex flex-wrap gap-2 mt-3">
                            <button id="btn-export-excel" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm"><i class="fas fa-file-excel mr-1"></i>Excel</button>
                            <button id="btn-export-csv" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm"><i class="fas fa-file-csv mr-1"></i>CSV</button>
                            <button id="btn-export-json" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm"><i class="fas fa-file-code mr-1"></i>JSON</button>
                            <div class="flex-grow"></div>
                            <button id="btn-clear-db" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm"><i class="fas fa-trash-alt mr-1"></i>清空</button>
                        </div>
                    </div>

                    <div id="admin-cards-container">
                        <div class="p-8 text-center text-gray-500 bg-white rounded-2xl shadow-sm"><i class="fas fa-spinner fa-spin text-3xl mb-2" style="color:var(--brand-500)"></i><br>連線中，資料即將出現...</div>
                    </div>
                </div>`;

            bindAdminThemeToggle();
            document.getElementById('btn-resp-back').addEventListener('click', () => {
                if (unsubResponses) { unsubResponses(); unsubResponses = null; }
                state.mode = 'admin-dashboard';
                applyAdminChrome();
                render();
            });
            document.getElementById('btn-clear-db').addEventListener('click', clearAllResponsesFlow);
            document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
            document.getElementById('btn-export-json').addEventListener('click', exportJSON);
            document.getElementById('btn-export-excel').addEventListener('click', exportExcel);

            if (unsubResponses) unsubResponses();
            unsubResponses = onSnapshot(responsesCol(state.viewingSurveyId), snap => {
                const rows = [];
                snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
                rows.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
                state.responsesData = rows;
                if (state.mode === 'admin-responses') refreshResponsesPanel();
            }, err => console.error(err));
        }

        function getDisplayName(row) {
            const s = state.viewingSurveyMeta;
            const q = (s.questions || []).find(qq => qq.type === 'short_text');
            if (q && row.answers && row.answers[q.id]) return row.answers[q.id];
            return '匿名回覆';
        }

        function refreshResponsesPanel() {
            const s = state.viewingSurveyMeta;
            const rows = state.responsesData;
            document.getElementById('resp-total-badge').textContent = `${rows.length} 筆`;

            const statsContainer = document.getElementById('question-stats');
            statsContainer.innerHTML = '';
            (s.questions || []).forEach(q => {
                if (q.type.startsWith('choice')) statsContainer.appendChild(buildChoiceStatBlock(q, rows));
                else if (q.type === 'counter_group') statsContainer.appendChild(buildCounterStatBlock(q, rows));
            });

            const container = document.getElementById('admin-cards-container');
            if (rows.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500 bg-white rounded-2xl shadow-sm border border-gray-100"><i class="far fa-folder-open text-3xl mb-3 block text-gray-300"></i>目前尚無任何問卷資料</div>`;
                return;
            }
            container.innerHTML = rows.map((row, idx) => {
                const isOpen = state.expandedCards.has(row.id);
                const name = getDisplayName(row);
                const dateStr = row.timestamp ? new Date(row.timestamp).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <button class="card-toggle w-full flex items-center gap-3 p-4 text-left hover:bg-gray-50 transition-colors" data-id="${row.id}">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0" style="background-color:var(--brand-100);color:var(--brand-600)">${idx + 1}</div>
                        <div class="flex-grow min-w-0">
                            <div class="font-bold text-gray-800 truncate">${escapeHtml(name)}</div>
                            <div class="text-xs text-gray-400 mt-0.5">${dateStr} 填寫</div>
                        </div>
                        <i class="fas fa-chevron-down text-gray-400 text-sm admin-card-chevron ${isOpen ? 'open' : ''}"></i>
                    </button>
                    <div class="admin-card-detail ${isOpen ? 'open' : ''}" id="detail-${row.id}">
                        <div class="px-4 pb-4 space-y-3 border-t border-gray-100 pt-3">
                            ${(s.questions || []).map(q => renderAnswerDetail(q, row.answers ? row.answers[q.id] : undefined)).join('')}
                            <div class="flex justify-end pt-1">
                                <button class="delete-btn text-xs text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition-colors" data-id="${row.id}"><i class="fas fa-trash mr-1"></i>刪除此筆</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            container.querySelectorAll('.card-toggle').forEach(btn => btn.addEventListener('click', () => {
                const id = btn.dataset.id;
                const detail = document.getElementById(`detail-${id}`);
                const chevron = btn.querySelector('.admin-card-chevron');
                if (state.expandedCards.has(id)) { state.expandedCards.delete(id); detail.classList.remove('open'); chevron.classList.remove('open'); }
                else { state.expandedCards.add(id); detail.classList.add('open'); chevron.classList.add('open'); }
            }));
            container.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async function () {
                const confirmed = await showConfirm('刪除單筆資料', '確定要刪除這筆問卷資料嗎？');
                if (confirmed) {
                    try { await deleteDoc(responseDocRef(state.viewingSurveyId, this.dataset.id)); state.expandedCards.delete(this.dataset.id); }
                    catch (e) { showMessage('錯誤', '刪除失敗', 'error'); }
                }
            }));
        }

        function renderAnswerDetail(q, ans) {
            if (ans === undefined || ans === null) return '';
            let valueHtml = '';
            if (q.type === 'short_text' || q.type === 'textarea') {
                if (!String(ans).trim()) return '';
                valueHtml = `<div class="text-sm text-gray-700 bg-gray-50 rounded-xl p-3 leading-relaxed whitespace-pre-line">${escapeHtml(ans)}</div>`;
            } else if (q.type.startsWith('choice')) {
                const labels = (ans.selected || []).map(id => q.options.find(o => o.id === id)?.label || id);
                if (ans.custom) labels.push('許願: ' + ans.custom);
                if (labels.length === 0) return '';
                valueHtml = `<div class="text-sm text-gray-700">${labels.map(escapeHtml).join('、')}</div>`;
            } else if (q.type === 'counter_group') {
                const parts = q.items.map(item => {
                    const c = (ans.counts || {})[item.id] || 0;
                    let str = `${item.label} ${c}`;
                    const ages = (ans.ages || {})[item.id];
                    if (item.ageOptions && ages && ages.length) str += `（${ages.join('、')}）`;
                    return str;
                });
                valueHtml = `<div class="text-sm text-gray-700">${parts.join('、')}</div>`;
            }
            if (!valueHtml) return '';
            return `<div class="flex gap-2">
                <i class="fas fa-circle-dot mt-1.5 w-3 flex-shrink-0 text-xs" style="color:var(--brand-400)"></i>
                <div class="flex-grow min-w-0">
                    <div class="text-xs font-semibold text-gray-500 mb-1">${escapeHtml(q.label)}</div>
                    ${valueHtml}
                </div>
            </div>`;
        }

        function buildChoiceStatBlock(q, rows) {
            const counts = {};
            let customCount = 0;
            const customList = [];
            rows.forEach(row => {
                const ans = row.answers ? row.answers[q.id] : null;
                if (!ans) return;
                (ans.selected || []).forEach(optId => {
                    const opt = q.options.find(o => o.id === optId);
                    const label = opt ? opt.label : optId;
                    counts[label] = (counts[label] || 0) + 1;
                });
                if (ans.custom && ans.custom.trim()) { customCount++; customList.push(ans.custom.trim()); }
            });
            if (customCount > 0) counts['其他(自填)'] = customCount;

            const wrap = document.createElement('div');
            wrap.className = 'mb-4 border border-gray-100 rounded-2xl p-3';
            const chartId = 'chart-' + q.id;
            wrap.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-bold text-gray-700">${escapeHtml(q.label)}</div>
                    ${customList.length ? `<button class="stat-toggle text-xs" style="color:var(--brand-600)" data-key="${q.id}">查看自填內容 <i class="fas fa-chevron-down"></i></button>` : ''}
                </div>
                <div class="w-full h-52 relative"><canvas id="${chartId}"></canvas></div>
                ${customList.length ? `<div class="stat-detail" id="stat-detail-${q.id}"><div class="mt-2 pt-2 border-t border-gray-100 space-y-1 text-xs text-gray-600">${customList.map(c => `<div class="bg-gray-50 rounded-lg px-2 py-1">${escapeHtml(c)}</div>`).join('')}</div></div>` : ''}
            `;
            setTimeout(() => {
                const canvas = wrap.querySelector(`#${chartId}`);
                if (!canvas) return;
                if (chartInstances[chartId]) chartInstances[chartId].destroy();
                const labels = Object.keys(counts), data = Object.values(counts);
                if (data.length === 0) { canvas.parentElement.innerHTML = '<p class="text-gray-400 text-xs text-center py-8">尚無資料</p>'; return; }
                chartInstances[chartId] = new Chart(canvas, {
                    type: 'pie',
                    data: { labels, datasets: [{ data, backgroundColor: CHART_COLORS }] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
                            datalabels: {
                                color: '#000', font: { weight: 'bold', size: 12 },
                                formatter: (value, ctx) => { const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0); const pct = Math.round(value / total * 100); return pct >= 5 ? `${value}\n(${pct}%)` : ''; }
                            }
                        }
                    }
                });
                const toggleBtn = wrap.querySelector('.stat-toggle');
                if (toggleBtn) toggleBtn.addEventListener('click', () => {
                    state.statOpen[q.id] = !state.statOpen[q.id];
                    document.getElementById(`stat-detail-${q.id}`).classList.toggle('open', state.statOpen[q.id]);
                });
            }, 0);
            return wrap;
        }

        function buildCounterStatBlock(q, rows) {
            const wrap = document.createElement('div');
            wrap.className = 'mb-4 border border-gray-100 rounded-2xl p-3';
            const sums = {};
            q.items.forEach(item => sums[item.id] = 0);
            const ageCounts = {};
            rows.forEach(row => {
                const ans = row.answers ? row.answers[q.id] : null;
                if (!ans) return;
                q.items.forEach(item => {
                    sums[item.id] += (ans.counts || {})[item.id] || 0;
                    if (item.ageOptions) {
                        (ans.ages && ans.ages[item.id] || []).forEach(age => {
                            ageCounts[item.id] = ageCounts[item.id] || {};
                            ageCounts[item.id][age] = (ageCounts[item.id][age] || 0) + 1;
                        });
                    }
                });
            });
            wrap.innerHTML = `
                <div class="text-sm font-bold text-gray-700 mb-2">${escapeHtml(q.label)}</div>
                <div class="grid gap-2" style="grid-template-columns:repeat(${q.items.length},minmax(0,1fr))">
                    ${q.items.map(item => `
                        <div class="stat-pill rounded-xl p-2.5 text-center">
                            <div class="text-xl font-extrabold" style="color:var(--brand-600)">${sums[item.id]}</div>
                            <div class="text-xs text-gray-500 mt-0.5">${escapeHtml(item.label)}合計</div>
                        </div>
                    `).join('')}
                </div>
                ${q.items.filter(it => it.ageOptions).map(item => {
                    const dist = ageCounts[item.id] || {};
                    const total = Object.values(dist).reduce((a, b) => a + b, 0);
                    if (total === 0) return '';
                    const ordered = (item.ageOptions || []).filter(a => dist[a]);
                    return `<div class="mt-2 rounded-2xl p-3 text-sm" style="background-color:var(--brand-50);border:1px solid var(--brand-100)">
                        <div class="text-xs font-bold text-gray-600 mb-2 flex items-center gap-1.5"><i class="fas fa-birthday-cake" style="color:var(--brand-500)"></i>${escapeHtml(item.label)}年齡分佈（共 ${total} 位）</div>
                        <div class="space-y-1.5">
                            ${ordered.map(age => {
                                const cnt = dist[age]; const pct = Math.round(cnt / total * 100);
                                return `<div class="flex items-center gap-2">
                                    <div class="w-16 text-xs text-gray-600 font-medium text-right flex-shrink-0">${escapeHtml(age)}</div>
                                    <div class="flex-grow bg-white rounded-full h-4 overflow-hidden border" style="border-color:var(--brand-100)"><div class="h-full rounded-full" style="width:${pct}%;background-color:var(--brand-400)"></div></div>
                                    <div class="w-10 text-xs text-gray-500 text-right flex-shrink-0">${cnt} 位</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }).join('')}
            `;
            return wrap;
        }

        async function clearAllResponsesFlow() {
            const confirmed = await showConfirm('警告：清空資料庫', '這將會刪除這份問卷收集到的所有回覆資料，此操作無法復原。確定要繼續嗎？');
            if (!confirmed) return;
            try {
                const snap = await getDocs(responsesCol(state.viewingSurveyId));
                await Promise.all(snap.docs.map(d => deleteDoc(responseDocRef(state.viewingSurveyId, d.id))));
                showMessage('清理完成', '已成功刪除所有問卷資料。', 'success');
            } catch (e) { showMessage('清理失敗', '發生錯誤，無法清空資料。', 'error'); }
        }

        function getExportRows() {
            const s = state.viewingSurveyMeta;
            return state.responsesData.map(row => {
                const out = { '填寫時間': row.timestamp ? new Date(row.timestamp).toLocaleString('zh-TW') : '' };
                (s.questions || []).forEach(q => {
                    const ans = row.answers ? row.answers[q.id] : undefined;
                    let str = '';
                    if (ans === undefined || ans === null) str = '';
                    else if (q.type === 'short_text' || q.type === 'textarea') str = String(ans);
                    else if (q.type.startsWith('choice')) {
                        const labels = (ans.selected || []).map(id => q.options.find(o => o.id === id)?.label || id);
                        if (ans.custom) labels.push('許願:' + ans.custom);
                        str = labels.join('、');
                    } else if (q.type === 'counter_group') {
                        str = q.items.map(item => {
                            const c = (ans.counts || {})[item.id] || 0;
                            const ages = (ans.ages || {})[item.id];
                            return `${item.label}${c}${ages && ages.length ? '(' + ages.join('、') + ')' : ''}`;
                        }).join('、');
                    }
                    out[q.label] = str;
                });
                return out;
            });
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = fileName; a.click();
            URL.revokeObjectURL(url);
        }

        function exportJSON() {
            if (state.responsesData.length === 0) return showMessage('提示', '沒有資料可匯出');
            downloadFile(JSON.stringify(getExportRows(), null, 2), `${state.viewingSurveyMeta.title}_問卷結果.json`, 'application/json');
        }
        function exportCSV() {
            if (state.responsesData.length === 0) return showMessage('提示', '沒有資料可匯出');
            const data = getExportRows();
            const headers = Object.keys(data[0]);
            let csv = "\uFEFF" + headers.join(',') + '\n';
            data.forEach(row => {
                const vals = headers.map(h => { let v = row[h] == null ? '' : String(row[h]); if (v.includes(',') || v.includes('\n') || v.includes('"')) v = `"${v.replace(/"/g, '""')}"`; return v; });
                csv += vals.join(',') + '\n';
            });
            downloadFile(csv, `${state.viewingSurveyMeta.title}_問卷結果.csv`, 'text/csv;charset=utf-8;');
        }
        function exportExcel() {
            if (state.responsesData.length === 0) return showMessage('提示', '沒有資料可匯出');
            if (typeof XLSX === 'undefined') return showMessage('錯誤', 'Excel 匯出工具尚未載入，請改用 CSV 匯出。', 'error');
            const data = getExportRows();
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '問卷結果');
            XLSX.writeFile(wb, `${state.viewingSurveyMeta.title}_問卷結果.xlsx`);
        }

        window.addEventListener('DOMContentLoaded', () => { boot(); adjustLayoutOffsets(); });
    </script>
</body>

</html>
